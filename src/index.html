<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HomeCare · QA demo</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f1f5f3;color:#142e26;font:16px system-ui}main{max-width:900px;margin:64px auto;padding:24px}.tag{font-size:12px;letter-spacing:2px;color:#49715f}h1{font-size:48px;line-height:1.1;max-width:600px}p{line-height:1.6;color:#53675e}.card{background:white;border:1px solid #d9e4de;border-radius:20px;padding:28px;max-width:520px}label{display:block;font-weight:600;margin:18px 0 7px}input,select,button{font:inherit;width:100%;padding:13px;border-radius:8px;border:1px solid #aebfb5}button{margin-top:22px;background:#175e45;color:white;border:0;cursor:pointer}button:disabled{opacity:.5}#result{white-space:pre-line}small{color:#66796f}footer{margin-top:30px;font-size:13px;color:#66796f}</style>
<main><div class="tag">HOMECARE / QA PORTFOLIO</div><h1>A little help.<br>A better day.</h1><p>A local booking demo for practicing test design, API validation and browser automation.</p><div class="card"><h2>Book a service</h2><form id="booking"><label for="name">Your name</label><input id="name" name="name" required minlength="2" maxlength="60" autocomplete="name"><label for="service">Service</label><select id="service" required><option value="cleaning">Home cleaning · ₺500 / room</option><option value="repair">Home repair · ₺750 / room</option></select><label for="rooms">Rooms</label><input id="rooms" type="number" min="1" max="5" step="1" value="1" required><button id="submit" type="submit">Confirm booking</button></form><p id="result" role="status" aria-live="polite"></p><button id="cancel" hidden>Cancel booking</button><small>Demo only · no payment · data resets on restart</small></div><footer>Training fixture. Not affiliated with Justlife or any service provider.</footer></main>
<script>
let bookingId;const result=document.querySelector('#result');const cancel=document.querySelector('#cancel');
document.querySelector('#booking').addEventListener('submit',async e=>{e.preventDefault();const button=document.querySelector('#submit');button.disabled=true;cancel.hidden=true;try{const r=await fetch('/api/bookings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:document.querySelector('#name').value,serviceId:document.querySelector('#service').value,rooms:Number(document.querySelector('#rooms').value)})});const data=await r.json();if(!r.ok)throw Error(data.error);bookingId=data.id;result.textContent='Booking confirmed\nTotal: ₺'+data.total;cancel.hidden=false;}catch(err){result.textContent=err.message;}finally{button.disabled=false;}});
cancel.addEventListener('click',async()=>{cancel.disabled=true;try{const r=await fetch('/api/bookings/'+bookingId,{method:'DELETE'});const data=await r.json();if(!r.ok)throw Error(data.error);result.textContent='Booking cancelled';cancel.hidden=true;}catch(err){result.textContent=err.message;}finally{cancel.disabled=false;}});
</script></html>
