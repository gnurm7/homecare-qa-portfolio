name: QA checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm ci
      - run: mkdir -p test-results
      - name: API tests (JUnit)
        run: node --test --test-reporter=junit tests/api.test.mjs > test-results/api.xml
      - name: SQL data quality checks
        if: ${{ !cancelled() }}
        run: python scripts/check_sql.py
      - name: Install Chromium and system dependencies
        id: browser
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npx playwright install --with-deps chromium; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "Browser dependency installation failed; retrying (attempt $attempt of 3)."
            sleep 10
          done
      - name: Browser tests (JUnit and failure traces)
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        run: node --test --test-reporter=junit tests/ui.test.mjs > test-results/ui.xml
      - name: Upload execution evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: qa-results-node-${{ matrix.node }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 14
